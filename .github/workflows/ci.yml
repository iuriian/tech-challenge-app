name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  static_code_analysis:
    name: 'Static Code Analysis'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Spotless
        id: spotless
        uses: ./.github/actions/spotless
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-violation: 'false'

      - name: Detekt
        id: detekt
        if: ${{ !cancelled() }}
        uses: ./.github/actions/detekt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          max-issues: '10'
          fail-on-violation: 'false'

      - name: Quality Gate
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SPOTLESS: ${{ steps.spotless.outputs.outcome }}
          DETEKT: ${{ steps.detekt.outputs.outcome }}
        run: |
          failed=0

          if [ "$SPOTLESS" = "success" ]; then
            echo "✅ Spotless"
          else
            echo "::error title=Spotless::Há problemas de formatação. Rode './gradlew spotlessApply' e faça commit."
            failed=1
          fi

          if [ "$DETEKT" = "success" ]; then
            echo "✅ Detekt"
          else
            echo "::error title=Detekt::Foram encontrados problemas na análise estática. Veja o comentário no PR."
            failed=1
          fi

          exit $failed

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: static_code_analysis
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Unit Test
        uses: ./.github/actions/unit-test
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: unit_test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Coverage
        uses: ./.github/actions/coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          minimum: '90'
          metric: 'BRANCH'
          gradle-task: 'jacocoTestReport'
          reports-glob: '**/build/reports/jacoco/test/jacocoTestReport.xml'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: coverage
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kotlin
        uses: ./.github/actions/setup-kotlin

      - name: Build
        run: ./gradlew build
        shell: bash

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/
          retention-days: 7