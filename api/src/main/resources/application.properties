spring.application.name=oficina-mecanica

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

spring.config.import=optional:file:.env[.properties]

# Função serverless de autenticação
auth.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${auth.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${auth.issuer-uri}/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH_AUDIENCE:oficina}

# Actuator / probes do Kubernetes
# Por padrao o Spring Boot 3 expoe apenas o endpoint "health" via HTTP e so ativa
# os grupos liveness/readiness quando detecta que esta rodando em Kubernetes.
# Ativamos explicitamente para que os endpoints existam em qualquer ambiente
# (container solto, kind, GKE) e possam ser validados no smoke test do CI.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# O banco entra apenas no grupo de READINESS: se o Postgres cair, o pod sai do
# balanceamento mas NAO e morto pelo kubelet. Colocar o banco no liveness faria o
# Kubernetes reiniciar a aplicacao por causa de um problema que nao esta nela.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Springdoc / Swagger UI
springdoc.swagger-ui.oauth.client-secret=
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
