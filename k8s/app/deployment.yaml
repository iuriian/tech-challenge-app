apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      annotations:
        checksum/secrets: "__SECRETS_HASH__"
      labels:
        app: app
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: DB_HOST }
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p 5432; do
                echo "aguardando postgres..."
                sleep 3
              done
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: DB_HOST }
            - name: DB_SSLMODE
              valueFrom:
                configMapKeyRef: { name: app-config, key: DB_SSLMODE }
            - name: AUTH_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_ISSUER_URI
            - name: AUTH_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_AUDIENCE
            - name: DB_URL
              value: "jdbc:postgresql://$(DB_HOST):5432/$(POSTGRES_DB)?sslmode=$(DB_SSLMODE)"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            # 3 pods x 4 = 12 conexoes; com as 6 do auth, ficam 18 das ~22 da db-f1-micro
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
              value: "4"
            # New Relic APM — secret opcional: sem ele o agent sobe desabilitado.
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license
                  key: NEW_RELIC_LICENSE_KEY
                  optional: true
            - name: NEW_RELIC_APP_NAME
              value: "__NEW_RELIC_APP_NAME__"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app: app
spec:
  type: LoadBalancer
  # IP reservado (google_compute_address.app_lb no tech-challenge-infra-k8s).
  # E o endereco que o API Gateway usa como backend: com o IP efemero que o GKE
  # sorteia, recriar o Service troca o endereco e o gateway passa a responder
  # 502 sem que nada aqui tenha mudado. O deploy.sh remove esta linha quando
  # APP_LB_IP nao esta definido, para o manifest continuar servindo ao kind.
  loadBalancerIP: __APP_LB_IP__
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: 8080
