services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./conf/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-oficina}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-app
    ports:
      - "8090:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-oficina}
      DB_USERNAME: ${POSTGRES_USER:-user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:8081}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-oficina}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    profiles: ["full"]
    image: nginx:alpine
    container_name: postech-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_started

networks:
  default:
    driver: bridge

volumes:
  postgres_data: